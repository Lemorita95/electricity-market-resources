name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t electricity-db-app:ci .

  test:
      name: Run Tests
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Run pytest
          run: pytest tests/ -v
          env:
            PYTHONPATH: src
            EUMDAC_CONSUMER_KEY: ${{ secrets.EUMDAC_CONSUMER_KEY }}
            EUMDAC_CONSUMER_SECRET: ${{ secrets.EUMDAC_CONSUMER_SECRET }}
            ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
            ENTSOE_BASE_URL: ${{ secrets.ENTSOE_BASE_URL }}
            CDS_API_URL: ${{ secrets.CDS_API_URL }}
            CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

      - name: Build image for trivy
        run: docker build -t electricity-db-app:ci .

      - name: Run trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: electricity-db-app:ci
          severity: CRITICAL,HIGH
          exit-code: 0